<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%;overflow:hidden}
body{background:#0A0A0F;font-family:'DM Sans',sans-serif;color:#F0EEF8}
::-webkit-scrollbar{width:3px}
::-webkit-scrollbar-thumb{background:rgba(167,139,250,.3);border-radius:4px}
button{font-family:'DM Sans',sans-serif;cursor:pointer;border:none;outline:none}
input,select,textarea{font-family:'DM Sans',sans-serif;outline:none;border:none}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideLeft{from{opacity:0;transform:translateX(-100%)}to{opacity:1;transform:translateX(0)}}
@keyframes confettiBurst{0%{opacity:1;transform:translateX(-50%) scale(.4) translateY(0)}100%{opacity:0;transform:translateX(-50%) scale(2) translateY(-60px)}}
@keyframes ringPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.08);opacity:.8}}
@keyframes bellShake{0%,100%{transform:rotate(0)}20%{transform:rotate(-15deg)}40%{transform:rotate(15deg)}60%{transform:rotate(-10deg)}80%{transform:rotate(10deg)}}
.fade{animation:fadeIn .3s ease}
.slide-up{animation:slideUp .3s ease}
.drawer-anim{animation:slideLeft .25s ease}
.confetti{animation:confettiBurst 1s ease forwards;pointer-events:none;position:absolute;font-size:26px;top:-12px;left:50%;z-index:30}
.ring-pulse{animation:ringPulse 1s ease infinite}
.hcard{transition:transform .15s;cursor:pointer}
.hcard:active{transform:scale(.96)}
.bell-shake{animation:bellShake .5s ease}
.notification-banner{position:fixed;top:0;left:0;right:0;z-index:9999;animation:slideUp .3s ease}
</style>

function todayStr(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function fmtDate(d){const x=new Date(d);return`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,"0")}-${String(x.getDate()).padStart(2,"0")}`;}
function addD(n){const d=new Date();d.setDate(d.getDate()+n);return fmtDate(d);}
function relDay(ds){const diff=Math.round((new Date(ds+"T12:00:00")-new Date(todayStr()+"T12:00:00"))/86400000);if(diff===0)return"Today";if(diff===1)return"Tomorrow";if(diff===-1)return"Yesterday";return diff<0?`${-diff}d ago`:`in ${diff}d`;}
function getGrade(s){return GRADE_SCALE.find(g=>s>=g.min)||GRADE_SCALE[GRADE_SCALE.length-1];}
function calcGPA(cs){const v=cs.filter(c=>c.score!==""&&c.credits);if(!v.length)return 0;const t=v.reduce((s,c)=>s+getGrade(Number(c.score)).gp*Number(c.credits),0);const cr=v.reduce((s,c)=>s+Number(c.credits),0);return cr?t/cr:0;}
function load(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch{return d;}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch{}}
function fmtTime(s){return`${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;}
function fmtM(n){return`₦${Number(n).toLocaleString()}`;}
function now12(){const d=new Date();return`${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;}

const SOUNDS={bell:{n:"🔔 Bell",s:[[880,0,.9,"sine"],[1320,0,.9,"sine"]]},chime:{n:"🎐 Chime",s:[[660,0,.3,"sine"],[880,.25,.3,"sine"],[1100,.5,.5,"sine"]]},beep:{n:"📟 Beep",s:[[1000,0,.15,"square"],[1000,.25,.15,"square"],[1000,.5,.15,"square"]]},melody:{n:"🎵 Melody",s:[[523,0,.2,"triangle"],[659,.2,.2,"triangle"],[784,.4,.2,"triangle"],[1047,.6,.5,"triangle"]]},digital:{n:"⏰ Alarm",s:[[880,0,.12,"sawtooth"],[660,.15,.12,"sawtooth"],[880,.3,.12,"sawtooth"],[660,.45,.12,"sawtooth"],[880,.6,.12,"sawtooth"]]},soft:{n:"🌿 Soft",s:[[392,0,.6,"sine"],[494,.4,.8,"sine"]]}};
function playSound(k){try{const d=SOUNDS[k]||SOUNDS.bell;const a=new(window.AudioContext||window.webkitAudioContext)();d.s.forEach(([f,t,l,ty])=>{const o=a.createOscillator(),g=a.createGain();o.type=ty;o.frequency.value=f;o.connect(g);g.connect(a.destination);const st=a.currentTime+t;g.gain.setValueAtTime(.0001,st);g.gain.exponentialRampToValueAtTime(.25,st+.02);g.gain.exponentialRampToValueAtTime(.0001,st+l);o.start(st);o.stop(st+l+.05);});}catch(e){}}
function hit(t,now){if(!t)return false;const[a,b]=t.split(":").map(Number),[c,d]=now.split(":").map(Number);const df=(c*60+d)-(a*60+b);return df>=0&&df<=3;}
function alarmLink(t,minus,msg){const[h,m]=(t||"08:00").split(":").map(Number);const tot=(((h*60+m-(minus||0))%1440)+1440)%1440;return`intent:#Intent;action=android.intent.action.SET_ALARM;i.android.intent.extra.alarm.HOUR=${Math.floor(tot/60)};i.android.intent.extra.alarm.MINUTES=${tot%60};S.android.intent.extra.alarm.MESSAGE=${encodeURIComponent(msg)};end`;}
function timerLink(sec){return`intent:#Intent;action=android.intent.action.SET_TIMER;i.android.intent.extra.alarm.LENGTH=${Math.max(1,Math.round(sec))};S.android.intent.extra.alarm.MESSAGE=${encodeURIComponent("UnilifePlanner focus session")};B.android.intent.extra.alarm.SKIP_UI=true;end`;}
function icsEsc(t){return String(t||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");}
function icsDT(d,t){return d.replace(/-/g,"")+"T"+t.replace(":","")+"00";}
function addMin(t,m){const[h,mm]=t.split(":").map(Number);const x=(h*60+mm+m)%1440;return String(Math.floor(x/60)).padStart(2,"0")+":"+String(x%60).padStart(2,"0");}
function nextDate(di){const d=new Date();d.setDate(d.getDate()+((di-((d.getDay()+6)%7)+7)%7));return fmtDate(d);}
function buildICS(evs){const L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//UnilifePlanner//EN","CALSCALE:GREGORIAN"];const stamp=new Date().toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";
  evs.forEach((e,i)=>{L.push("BEGIN:VEVENT",`UID:ul-${e.uid||i}-${Date.now()}@unilife`,`DTSTAMP:${stamp}`,`DTSTART:${icsDT(e.date,e.start)}`,`DTEND:${icsDT(e.date,e.end||addMin(e.start,30))}`,`SUMMARY:${icsEsc(e.title)}`);
    if(e.loc)L.push(`LOCATION:${icsEsc(e.loc)}`);if(e.desc)L.push(`DESCRIPTION:${icsEsc(e.desc)}`);if(e.rrule)L.push(`RRULE:${e.rrule}`);
    (e.alerts||[]).forEach(m=>L.push("BEGIN:VALARM","ACTION:DISPLAY",`DESCRIPTION:${icsEsc(e.title)}`,`TRIGGER:-PT${m}M`,"END:VALARM"));L.push("END:VEVENT");});
  L.push("END:VCALENDAR");return L.join("\r\n");}
function saveICS(evs,name){try{const b=new Blob([buildICS(evs)],{type:"text/calendar"});const u=URL.createObjectURL(b);const a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{document.body.removeChild(a);URL.revokeObjectURL(u);},1500);}catch(e){alert("Sorry, the calendar file could not be created.");}}

function dayIdx(){return(new Date().getDay()+6)%7;}
function overlaps(a,b){return a.day===b.day&&a.start<b.end&&b.start<a.end;}
function conflictIds(l){const s=new Set();l.forEach((a,i)=>l.forEach((b,j)=>{if(i<j&&overlaps(a,b)){s.add(a.id);s.add(b.id);}}));return s;}
function nextClass(cl){const di=dayIdx(),n=now12();for(let k=0;k<7;k++){const d=(di+k)%7;const l=cl.filter(c=>c.day===d&&(k>0||c.end>n)).sort((a,b)=>a.start.localeCompare(b.start));if(l.length)return{c:l[0],k,d};}return null;}

function ScheduleScreen({tasks,setTasks,timeBlocks,setTimeBlocks}){
  const[modal,setModal]=useState(false);

  const[form,setForm]=useState({title:"",date:TODAY,startTime:"08:00",endTime:"10:00",color:"#A78BFA",note:""});
  const COLORS=["#A78BFA","#60A5FA","#34D399","#FB7185","#FBBF24","#FB923C"];

  const todayBlocks=[
    ...tasks.filter(t=>t.date===TODAY&&(t.timeBlockStart||t.timeBlockEnd)).map(t=>({id:"t"+t.id,title:t.title,startTime:t.timeBlockStart||"00:00",endTime:t.timeBlockEnd||"23:59",color:CATS[t.cat]?.color||"#A78BFA",type:"task",done:t.done})),
    ...timeBlocks.filter(tb=>tb.date===TODAY).map(tb=>({...tb,type:"block"}))

  const upcomingBlocks=[

  ].sort((a,b)=>a.date?.localeCompare(b.date)||a.startTime?.localeCompare(b.startTime));

  const openAdd=()=>{setForm({title:"",date:TODAY,startTime:"08:00",endTime:"10:00",color:"#A78BFA",note:""});setEditId(null);setModal(true);};

  const save=()=>{if(!form.title.trim())return;editId?setTimeBlocks(tbs=>tbs.map(tb=>tb.id===editId?{...tb,...form}:tb)):setTimeBlocks(tbs=>[...tbs,{...form,id:Date.now()}]);setModal(false);};
  const del=id=>{setTimeBlocks(tbs=>tbs.filter(tb=>tb.id!==id));setModal(false);};

  const nowTime=now12();

  return(
    <div style={{height:"100%",overflowY:"auto",padding:16}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
        <div>
          <div style={{fontFamily:"'Syne',sans-serif",fontSize:20,fontWeight:800}}>Today's Schedule</div>
          <div style={{fontSize:11,opacity:.4}}>{new Date(TODAY+"T12:00:00").toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"})}</div>
        </div>
        <GBtn onClick={openAdd} style={{padding:"8px 14px",fontSize:12}}>+ Block</GBtn>
      </div>

      {/* Current time indicator */}
      <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14,padding:"8px 12px",borderRadius:10,background:"rgba(167,139,250,.1)",border:"1px solid rgba(167,139,250,.2)"}}>
        <div style={{width:8,height:8,borderRadius:"50%",background:"#A78BFA"}} className="ring-pulse"/>
        <span style={{fontSize:12,fontWeight:700,color:"#A78BFA"}}>Current time: {nowTime}</span>
      </div>

      {/* Today's blocks */}
      {todayBlocks.length===0&&<Empty msg="No schedule for today. Add a time block!" onAdd={openAdd}/>}
      {todayBlocks.map(tb=>{
        const isPast=tb.endTime<nowTime;
        const isNow=tb.startTime<=nowTime&&tb.endTime>=nowTime;
        return(
          <div key={tb.id} onClick={()=>tb.type==="block"&&openEdit(tb)} style={{display:"flex",gap:12,marginBottom:10,cursor:tb.type==="block"?"pointer":"default"}}>
            <div style={{width:50,textAlign:"right",flexShrink:0}}>
              <div style={{fontSize:11,fontWeight:700,color:"rgba(240,238,248,.5)"}}>{tb.startTime}</div>

              {isNow&&<div style={{fontSize:9,fontWeight:800,color:tb.color,marginBottom:4,letterSpacing:1}}>● IN PROGRESS</div>}
              <div style={{fontSize:13,fontWeight:800,textDecoration:tb.done?"line-through":"none"}}>{tb.title}</div>
              <div style={{fontSize:10,opacity:.4,marginTop:2}}>{tb.type==="task"?"📋 Task":"🕐 Time Block"} · {tb.startTime} – {tb.endTime}</div>
            </div>
          </div>
        );
      })}

      {/* Upcoming */}
      {upcomingBlocks.length>0&&<>
        <div style={{fontSize:11,fontWeight:800,opacity:.4,letterSpacing:1,margin:"20px 0 10px"}}>UPCOMING</div>
        {upcomingBlocks.slice(0,5).map(tb=>(
          <div key={tb.id} style={{display:"flex",alignItems:"center",gap:12,padding:"10px 12px",borderRadius:11,background:"rgba(255,255,255,.03)",border:"1px solid rgba(255,255,255,.06)",marginBottom:6}}>
            <div style={{width:3,height:40,borderRadius:3,background:tb.color||"#A78BFA",flexShrink:0}}/>
            <div style={{flex:1}}>
              <div style={{fontSize:13,fontWeight:700}}>{tb.title}</div>
              <div style={{fontSize:10,opacity:.4}}>{relDay(tb.date)} · {tb.startTime}{tb.endTime?" – "+tb.endTime:""}</div>
            </div>
          </div>
        ))}
      </>}

      {modal&&<Modal onClose={()=>setModal(false)} title={editId?"✏️ Edit Block":"🕐 New Time Block"} actions={<>
        <button onClick={()=>setModal(false)} style={{flex:1,padding:12,borderRadius:12,background:"rgba(255,255,255,.07)",color:"rgba(240,238,248,.6)",fontWeight:700,fontSize:14}}>Cancel</button>
        {editId&&<button onClick={()=>del(editId)} style={{padding:"12px 14px",borderRadius:12,background:"rgba(251,113,133,.12)",color:"#FB7185",fontWeight:700,fontSize:14}}>Delete</button>}
        <GBtn style={{flex:1}} onClick={save}>Save</GBtn>
      </>}>
        <FIn placeholder="What are you doing? e.g. Read Biology" value={form.title} onChange={e=>setForm(f=>({...f,title:e.target.value}))} autoFocus/>
        <FIn type="date" value={form.date} onChange={e=>setForm(f=>({...f,date:e.target.value}))}/>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
          <div>
            <div style={{fontSize:10,opacity:.5,marginBottom:4}}>START TIME</div>
            <FIn type="time" value={form.startTime} onChange={e=>setForm(f=>({...f,startTime:e.target.value}))}/>
          </div>
          <div>
            <div style={{fontSize:10,opacity:.5,marginBottom:4}}>END TIME</div>
            <FIn type="time" value={form.endTime} onChange={e=>setForm(f=>({...f,endTime:e.target.value}))}/>
          </div>
        </div>
        <div>
          <div style={{fontSize:10,opacity:.5,marginBottom:6}}>COLOUR</div>
          <div style={{display:"flex",gap:8}}>
            {COLORS.map(c=><button key={c} onClick={()=>setForm(f=>({...f,color:c}))} style={{width:28,height:28,borderRadius:8,background:c,border:form.color===c?"3px solid #fff":"3px solid transparent"}}/>)}
          </div>
        </div>
        <FIn placeholder="Notes (optional)" value={form.note} onChange={e=>setForm(f=>({...f,note:e.target.value}))}/>
        <div style={{padding:"10px 12px",borderRadius:10,background:"rgba(167,139,250,.08)",fontSize:12,opacity:.7}}>
          🔔 You'll get an alert when it's time to <strong>start</strong> and when it's time to <strong>stop</strong>!
        </div>
      </Modal>}
    </div>
  );
}

        <FSel value={form.priority} onChange={e=>setForm(f=>({...f,priority:e.target.value}))}>

      </div>
      {allCourses.length>0&&<FSel value={form.course} onChange={e=>setForm(f=>({...f,course:e.target.value}))}>

      <div>

        <FIn type="time" value={form.reminderTime} onChange={e=>setForm(f=>({...f,reminderTime:e.target.value}))}/>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
        <div>
          <div style={{fontSize:10,opacity:.5,marginBottom:4}}>▶️ START TIME</div>
          <FIn type="time" value={form.timeBlockStart} onChange={e=>setForm(f=>({...f,timeBlockStart:e.target.value}))}/>
        </div>
        <div>
          <div style={{fontSize:10,opacity:.5,marginBottom:4}}>⏹️ END TIME</div>
          <FIn type="time" value={form.timeBlockEnd} onChange={e=>setForm(f=>({...f,timeBlockEnd:e.target.value}))}/>
        </div>
      </div>

      <div style={{padding:"8px 12px",borderRadius:10,background:"rgba(167,139,250,.08)",fontSize:11,opacity:.7}}>
        🔔 In-app alerts ring while the app is open. For a phone alarm that rings even when it's closed:{(form.reminderTime||form.timeBlockStart)?<><a href={alarmLink(form.reminderTime||form.timeBlockStart,0,form.title||"Task")} style={{display:"block",marginTop:8,color:"#34D399",fontWeight:800}}>📱 Set phone alarm for {form.reminderTime||form.timeBlockStart}</a><button onClick={()=>saveICS([{uid:editId||"new",title:form.title||"Task",date:form.date,start:form.reminderTime||form.timeBlockStart,end:form.timeBlockEnd||addMin(form.reminderTime||form.timeBlockStart,30),desc:form.note,alerts:[30,5,0]}],"UniLife-task.ics")} style={{display:"block",marginTop:8,background:"none",color:"#60A5FA",fontWeight:800,fontSize:12,padding:0,textAlign:"left"}}>📲 Add to phone calendar (warns 30 and 5 min before)</button></>:" pick a time above first."}
      </div>
    </Modal>}
  </div>);
}

function TaskList({tasks,onTick,onEdit,onDel,confetti,openAdd,compact}){
  if(!tasks.length)return <Empty onAdd={openAdd}/>;
  return <div style={{display:"flex",flexDirection:"column",gap:compact?4:6}}>{tasks.map(t=><TaskRow key={t.id} task={t} onTick={onTick} onEdit={onEdit} onDel={onDel} confetti={confetti} compact={compact}/>)}</div>;
}

function TaskRow({task:t,onTick,onEdit,onDel,confetti,compact}){
  const cat=CATS[t.cat],pri={high:"#FB7185",medium:"#FBBF24",low:"#34D399"}[t.priority];
  const hasReminder=t.reminderTime||t.timeBlockStart;
  return(<div style={{display:"flex",alignItems:"flex-start",gap:9,padding:compact?"8px 10px":"12px 12px",borderRadius:12,background:t.done?"rgba(255,255,255,.02)":"rgba(255,255,255,.04)",border:`1px solid ${t.done?"rgba(255,255,255,.04)":"rgba(255,255,255,.07)"}`,position:"relative",overflow:"visible",opacity:t.done?.55:1,transition:"opacity .2s"}}>
    {confetti===t.id&&<div className="confetti">🎉</div>}
    <button onClick={()=>onTick(t.id)} style={{width:22,height:22,borderRadius:7,flexShrink:0,marginTop:1,background:t.done?`${cat.color}28`:"rgba(255,255,255,.06)",border:t.done?`2px solid ${cat.color}`:"2px solid rgba(255,255,255,.15)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:11,transition:"all .2s"}}>
      {t.done&&<span style={{color:cat.color,fontWeight:900}}>✓</span>}
    </button>
    <div style={{width:3,borderRadius:3,background:cat.color,flexShrink:0,alignSelf:"stretch",opacity:.7}}/>
    <div style={{flex:1,minWidth:0,cursor:"pointer"}} onClick={()=>onEdit(t)}>
      <div style={{fontSize:compact?12:13,fontWeight:700,textDecoration:t.done?"line-through":"none",color:t.done?"rgba(240,238,248,.3)":"#F0EEF8",marginBottom:2}}>{t.title}</div>
      {t.note&&!compact&&<div style={{fontSize:10,opacity:.35,marginBottom:3}}>{t.note}</div>}
      {t.course&&<div style={{fontSize:9,opacity:.45,marginBottom:3}}>📚 {t.course}</div>}
      <div style={{display:"flex",alignItems:"center",gap:5,flexWrap:"wrap"}}>
        <span style={{fontSize:9,fontWeight:700,padding:"1px 6px",borderRadius:4,background:`${cat.color}18`,color:cat.color}}>{cat.icon} {cat.label}</span>
        <span style={{fontSize:9,fontWeight:700,padding:"1px 6px",borderRadius:4,background:`${pri}18`,color:pri}}>{t.priority}</span>
        {!t.done&&t.date<TODAY&&<span style={{fontSize:9,fontWeight:700,padding:"1px 6px",borderRadius:4,background:"rgba(251,191,36,.15)",color:"#FBBF24"}}>⏳ Waiting for you</span>}
        {t.reminderTime&&<span style={{fontSize:9,fontWeight:700,padding:"1px 6px",borderRadius:4,background:"rgba(167,139,250,.15)",color:"#A78BFA"}}>🔔 {t.reminderTime}</span>}
        {t.timeBlockStart&&<span style={{fontSize:9,fontWeight:700,padding:"1px 6px",borderRadius:4,background:"rgba(52,211,153,.12)",color:"#34D399"}}>▶️ {t.timeBlockStart}{t.timeBlockEnd?" – "+t.timeBlockEnd:""}</span>}
        {!compact&&<span style={{fontSize:9,opacity:.3}}>{relDay(t.date)}</span>}
      </div>
    </div>
    <button onClick={()=>onDel(t.id)} style={{width:22,height:22,borderRadius:6,background:"rgba(251,113,133,.08)",color:"#FB7185",fontSize:10,opacity:.5,flexShrink:0}}>✕</button>
  </div>);
}

// ── Grades ───────────────────────────────────────────────────────────────────
function GradesScreen({grades,setGrades,profile}){

  const[modal,setModal]=useState(false);
  const[form,setForm]=useState({course:"",score:"",credits:"3",semester:"1"});
  const[editId,setEditId]=useState(null);
  const gpa=calcGPA(grades);
  const totalCr=grades.filter(g=>g.score!=="").reduce((s,g)=>s+Number(g.credits),0);
  const gpaColor=gpa>=3.5?"#34D399":gpa>=2.5?"#FBBF24":"#FB7185";
  const openAdd=()=>{setForm({course:allCourses[0]||"",score:"",credits:"3",semester:"1"});setEditId(null);setModal(true);};
  const openEdit=g=>{setForm({course:g.course,score:g.score,credits:g.credits,semester:g.semester||"1"});setEditId(g.id);setModal(true);};
  const save=()=>{if(!form.course)return;editId?setGrades(gs=>gs.map(g=>g.id===editId?{...g,...form}:g)):setGrades(gs=>[...gs,{...form,id:Date.now()}]);setModal(false);};
  const del=id=>{setGrades(gs=>gs.filter(g=>g.id!==id));setModal(false);};
  return(<div style={{height:"100%",overflowY:"auto",padding:16}}>
    <div style={{background:"linear-gradient(135deg,rgba(167,139,250,.12),rgba(96,165,250,.12))",border:"1px solid rgba(167,139,250,.2)",borderRadius:16,padding:20,marginBottom:16,textAlign:"center"}}>
      <div style={{fontSize:10,fontWeight:800,letterSpacing:1,opacity:.5,marginBottom:6}}>CUMULATIVE GPA</div>
      <div style={{fontFamily:"'Syne',sans-serif",fontSize:52,fontWeight:800,color:gpaColor}}>{gpa.toFixed(2)}</div>
      <div style={{fontSize:12,opacity:.4,marginTop:4}}>{totalCr} credit hours · {grades.length} courses</div>
      <div style={{height:6,background:"rgba(255,255,255,.08)",borderRadius:6,overflow:"hidden",marginTop:12}}>
        <div style={{height:"100%",width:`${(gpa/4)*100}%`,background:gpaColor,borderRadius:6,transition:"width .8s ease"}}/>
      </div>
    </div>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
      <div style={{fontFamily:"'Syne',sans-serif",fontSize:14,fontWeight:800}}>Course Grades</div>
      <GBtn onClick={openAdd} style={{padding:"7px 14px",fontSize:12}}>+ Add Course</GBtn>
    </div>
    {grades.length===0&&<Empty msg="No grades yet!" onAdd={openAdd}/>}
    {grades.map(g=>{const gr=g.score!==""?getGrade(Number(g.score)):null;const gc=gr?gr.gp>=3.5?"#34D399":gr.gp>=2?"#FBBF24":"#FB7185":"rgba(240,238,248,.3)";
      return(<div key={g.id} onClick={()=>openEdit(g)} style={{display:"flex",alignItems:"center",gap:12,padding:"12px 14px",borderRadius:12,background:"rgba(255,255,255,.04)",border:"1px solid rgba(255,255,255,.07)",marginBottom:7,cursor:"pointer"}}>
        <div style={{width:44,height:44,borderRadius:10,background:`${gc}18`,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}><div style={{fontFamily:"'Syne',sans-serif",fontSize:16,fontWeight:900,color:gc}}>{gr?gr.grade:"—"}</div></div>
        <div style={{flex:1,minWidth:0}}><div style={{fontSize:13,fontWeight:700,overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis"}}>{g.course}</div><div style={{fontSize:10,opacity:.4,marginTop:2}}>{g.credits} credits · Sem {g.semester}{g.score!==""?` · ${g.score}%`:""}</div></div>
        <div style={{fontSize:13,fontWeight:800,color:gc}}>{gr?gr.gp.toFixed(1):"—"}</div>
      </div>);
    })}
    {modal&&<Modal onClose={()=>setModal(false)} title={editId?"✏️ Edit Grade":"📊 Add Grade"} actions={<>
      <button onClick={()=>setModal(false)} style={{flex:1,padding:12,borderRadius:12,background:"rgba(255,255,255,.07)",color:"rgba(240,238,248,.6)",fontWeight:700,fontSize:14}}>Cancel</button>
      {editId&&<button onClick={()=>del(editId)} style={{padding:"12px 14px",borderRadius:12,background:"rgba(251,113,133,.12)",color:"#FB7185",fontWeight:700,fontSize:14}}>Delete</button>}
      <GBtn style={{flex:1}} onClick={save}>Save</GBtn>
    </>}>
      <FSel value={form.course} onChange={e=>setForm(f=>({...f,course:e.target.value}))}>
        {allCourses.length?allCourses.map(c=><option key={c} value={c}>{c}</option>):<option value="">Add courses in Profile first</option>}
        <option value="Other">Other…</option>
      </FSel>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8}}>
        <FIn type="number" placeholder="Score %" min="0" max="100" value={form.score} onChange={e=>setForm(f=>({...f,score:e.target.value}))}/>
        <FIn type="number" placeholder="Credits" min="1" max="6" value={form.credits} onChange={e=>setForm(f=>({...f,credits:e.target.value}))}/>

      </div>
      {form.score!==""&&<div style={{textAlign:"center",padding:10,borderRadius:10,background:"rgba(167,139,250,.1)"}}>
        <span style={{fontSize:20,fontWeight:900,color:getGrade(Number(form.score)).gp>=3.5?"#34D399":getGrade(Number(form.score)).gp>=2?"#FBBF24":"#FB7185"}}>{getGrade(Number(form.score)).grade}</span>
        <span style={{fontSize:12,opacity:.5,marginLeft:8}}>({getGrade(Number(form.score)).gp.toFixed(1)} GP)</span>
      </div>}
    </Modal>}
  </div>);
}

// ── Pomodoro ─────────────────────────────────────────────────────────────────
function PomodoroScreen(){
  const MODES={focus:{label:"Focus",dur:25*60,color:"#A78BFA"},short:{label:"Short Break",dur:5*60,color:"#34D399"},long:{label:"Long Break",dur:15*60,color:"#60A5FA"}};
  const[mode,setMode]=useState("focus");
  const[secs,setSecs]=useState(MODES.focus.dur);
  const[running,setRunning]=useState(false);
  const[sessions,setSessions]=useState(()=>load("ul_pomo",0));
  const[customM,setCustomM]=useState("");
  const ref=useRef(null);const secsRef=useRef(secs);secsRef.current=secs;
  useEffect(()=>save("ul_pomo",sessions),[sessions]);
  useEffect(()=>{setSecs(MODES[mode].dur);setRunning(false);},[mode]);
  useEffect(()=>{
    if(running){const endAt=Date.now()+secsRef.current*1000;ref.current=setInterval(()=>{const left=Math.max(0,Math.round((endAt-Date.now())/1000));setSecs(left);if(left<=0){clearInterval(ref.current);setRunning(false);if(mode==="focus")setSessions(n=>n+1);ding();}},500);}
    else clearInterval(ref.current);
    return()=>clearInterval(ref.current);
  },[running,mode]);
  const col=MODES[mode].color,pct=secs/MODES[mode].dur,r=80,circ=2*Math.PI*r;
  return(<div style={{height:"100%",overflowY:"auto",padding:20,display:"flex",flexDirection:"column",alignItems:"center"}}>
    <div style={{fontSize:10,fontWeight:800,opacity:.4,letterSpacing:1,marginBottom:14}}>STUDY TIMER</div>
    <div style={{display:"flex",gap:6,marginBottom:24,background:"rgba(255,255,255,.05)",borderRadius:12,padding:4}}>
      {Object.entries(MODES).map(([k,v])=>(<button key={k} onClick={()=>setMode(k)} style={{padding:"7px 12px",borderRadius:9,fontSize:11,fontWeight:700,background:mode===k?`${v.color}25`:"transparent",color:mode===k?v.color:"rgba(240,238,248,.4)",border:mode===k?`1px solid ${v.color}40`:"1px solid transparent"}}>{v.label}</button>))}
    </div>
    <div style={{position:"relative",width:200,height:200,marginBottom:24}}>
      <svg width="200" height="200" style={{transform:"rotate(-90deg)"}}>
        <circle cx="100" cy="100" r={r} fill="none" stroke="rgba(255,255,255,.06)" strokeWidth="8"/>
        <circle cx="100" cy="100" r={r} fill="none" stroke={col} strokeWidth="8" strokeLinecap="round" strokeDasharray={circ} strokeDashoffset={circ*(1-pct)} style={{transition:"stroke-dashoffset .5s ease",filter:`drop-shadow(0 0 8px ${col}60)`}}/>
      </svg>
      <div style={{position:"absolute",inset:0,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center"}}>
        <div style={{fontFamily:"'Syne',sans-serif",fontSize:40,fontWeight:800,color:col}}>{fmtTime(secs)}</div>
        <div style={{fontSize:11,opacity:.4,marginTop:2}}>{MODES[mode].label}</div>
      </div>
    </div>
    <div style={{display:"flex",gap:10,marginBottom:18}}>
      <button onClick={()=>{setSecs(MODES[mode].dur);setRunning(false);}} style={{width:48,height:48,borderRadius:14,background:"rgba(255,255,255,.07)",color:"rgba(240,238,248,.6)",fontSize:18}}>↺</button>
      <button onClick={()=>setRunning(r=>!r)} style={{width:100,height:48,borderRadius:14,background:`linear-gradient(135deg,${col},${col}aa)`,color:"#fff",fontSize:15,fontWeight:800,boxShadow:`0 0 20px ${col}40`}}>{running?"⏸ Pause":"▶ Start"}</button>
      <button onClick={()=>{clearInterval(ref.current);setRunning(false);setSecs(MODES[mode].dur);}} style={{width:48,height:48,borderRadius:14,background:"rgba(255,255,255,.07)",color:"rgba(240,238,248,.6)",fontSize:18}}>⏹</button>
    </div>
    <div style={{display:"flex",gap:6,alignItems:"center",marginBottom:20}}>
      {Array.from({length:4}).map((_,i)=><div key={i} style={{width:14,height:14,borderRadius:4,background:i<sessions%4?col:"rgba(255,255,255,.1)",transition:"all .3s"}}/>)}
      <span style={{fontSize:11,opacity:.4,marginLeft:4}}>{sessions} sessions</span>
    </div>
    <a href={timerLink(secs)} style={{...phoneBtn,width:"100%",maxWidth:280,marginBottom:16}}>📱 Also ring on my phone clock ({Math.round(secs/60)} min)</a>
    <div style={{width:"100%",maxWidth:280,background:"rgba(255,255,255,.04)",borderRadius:12,padding:12,marginBottom:16}}>
      <div style={{fontSize:9,fontWeight:800,opacity:.4,marginBottom:8,letterSpacing:1}}>CUSTOM DURATION</div>
      <div style={{display:"flex",gap:8}}>
        <FIn type="number" placeholder="Minutes (1-120)" value={customM} onChange={e=>setCustomM(e.target.value)} style={{flex:1}}/>
        <button onClick={()=>{const m=parseInt(customM);if(m>0&&m<=120){setSecs(m*60);setRunning(false);}}} style={{padding:"10px 14px",borderRadius:10,background:"rgba(167,139,250,.2)",color:"#A78BFA",fontWeight:800,fontSize:13}}>Set</button>
      </div>
    </div>
    <div style={{width:"100%",maxWidth:280,background:"rgba(255,255,255,.03)",borderRadius:12,padding:12}}>
      <div style={{fontSize:9,fontWeight:800,opacity:.4,marginBottom:8,letterSpacing:1}}>TIPS</div>
      {["Focus 25 min, break 5 min","After 4 sessions → 15 min break","Phone face-down during focus","One task per session"].map((t,i)=><div key={i} style={{fontSize:11,opacity:.45,marginBottom:5,paddingLeft:10,borderLeft:`2px solid ${col}40`}}>{t}</div>)}
    </div>
  </div>);
}

// ── Budget ───────────────────────────────────────────────────────────────────
function BudgetScreen({budget,setBudget}){
  const ECATS={food:"🍕 Food",transport:"🚌 Transport",books:"📚 Books",health:"💊 Health",social:"🎉 Social",clothing:"👕 Clothing",data:"📱 Data",other:"📦 Other"};
  const[modal,setModal]=useState(false);
  const[type,setType]=useState("expense");
  const[form,setForm]=useState({desc:"",amount:"",cat:"food",date:todayStr()});
  const[editId,setEditId]=useState(null);
  const[limitInput,setLimitInput]=useState(String(budget.limit));
  const totalIn=budget.income.reduce((s,i)=>s+Number(i.amount),0);
  const totalEx=budget.expenses.reduce((s,e)=>s+Number(e.amount),0);
  const balance=totalIn-totalEx;
  const pct=budget.limit?Math.min((totalEx/budget.limit)*100,100):0;
  const bc=pct>90?"#FB7185":pct>70?"#FBBF24":"#34D399";
  const openAdd=t=>{setType(t);setForm({desc:"",amount:"",cat:"food",date:todayStr()});setEditId(null);setModal(true);};
  const openEdit=(item,t)=>{setType(t);setForm({desc:item.desc,amount:String(item.amount),cat:item.cat||"other",date:item.date});setEditId(item.id);setModal(true);};
  const save=()=>{if(!form.amount||!form.desc)return;const item={...form,id:editId||Date.now()};if(type==="income"){editId?setBudget(b=>({...b,income:b.income.map(i=>i.id===editId?item:i)})):setBudget(b=>({...b,income:[...b.income,item]}));}else{editId?setBudget(b=>({...b,expenses:b.expenses.map(e=>e.id===editId?item:e)})):setBudget(b=>({...b,expenses:[...b.expenses,item]}));}setModal(false);};
  const del=()=>{if(type==="income")setBudget(b=>({...b,income:b.income.filter(i=>i.id!==editId)}));else setBudget(b=>({...b,expenses:b.expenses.filter(e=>e.id!==editId)}));setModal(false);};
  const allTx=[...budget.income.map(i=>({...i,type:"income"})),...budget.expenses.map(e=>({...e,type:"expense"}))].sort((a,b)=>b.date.localeCompare(a.date));
  return(<div style={{height:"100%",overflowY:"auto",padding:16}}>
    <div style={{background:"linear-gradient(135deg,rgba(52,211,153,.1),rgba(96,165,250,.1))",border:"1px solid rgba(52,211,153,.2)",borderRadius:16,padding:18,marginBottom:14}}>
      <div style={{fontSize:10,fontWeight:800,letterSpacing:1,opacity:.5,marginBottom:6}}>BALANCE</div>
      <div style={{fontFamily:"'Syne',sans-serif",fontSize:36,fontWeight:800,color:balance>=0?"#34D399":"#FB7185"}}>{fmtM(balance)}</div>
      <div style={{display:"flex",gap:20,marginTop:10}}>
        <div><div style={{fontSize:10,opacity:.4}}>Income</div><div style={{fontSize:15,fontWeight:800,color:"#34D399"}}>+{fmtM(totalIn)}</div></div>
        <div><div style={{fontSize:10,opacity:.4}}>Spent</div><div style={{fontSize:15,fontWeight:800,color:"#FB7185"}}>-{fmtM(totalEx)}</div></div>
      </div>
    </div>
    <div style={{background:"rgba(255,255,255,.04)",borderRadius:14,padding:14,marginBottom:14}}>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
        <div style={{fontSize:11,fontWeight:800,opacity:.5}}>MONTHLY LIMIT</div>
        <div style={{fontSize:12,fontWeight:700,color:bc}}>{pct.toFixed(0)}% used</div>
      </div>
      <div style={{height:6,background:"rgba(255,255,255,.08)",borderRadius:6,overflow:"hidden",marginBottom:8}}>
        <div style={{height:"100%",width:`${pct}%`,background:bc,borderRadius:6,transition:"width .6s ease"}}/>
      </div>
      <div style={{display:"flex",gap:8}}>
        <FIn placeholder="Monthly limit (₦)" value={limitInput} onChange={e=>setLimitInput(e.target.value)} type="number" style={{flex:1}}/>
        <button onClick={()=>setBudget(b=>({...b,limit:Number(limitInput)}))} style={{padding:"8px 12px",borderRadius:9,background:"rgba(167,139,250,.2)",color:"#A78BFA",fontWeight:700,fontSize:12}}>Set</button>
      </div>
    </div>
    <div style={{display:"flex",gap:8,marginBottom:14}}>
      <button onClick={()=>openAdd("income")} style={{flex:1,padding:"10px 0",borderRadius:12,background:"rgba(52,211,153,.1)",color:"#34D399",fontWeight:800,fontSize:13,border:"1px solid rgba(52,211,153,.2)"}}>+ Income</button>
      <button onClick={()=>openAdd("expense")} style={{flex:1,padding:"10px 0",borderRadius:12,background:"rgba(251,113,133,.1)",color:"#FB7185",fontWeight:800,fontSize:13,border:"1px solid rgba(251,113,133,.2)"}}>+ Expense</button>
    </div>
    <div style={{fontFamily:"'Syne',sans-serif",fontSize:13,fontWeight:800,marginBottom:10,opacity:.7}}>Transactions</div>
    {allTx.length===0&&<Empty msg="No transactions yet!"/>}
    {allTx.map(tx=>(<div key={tx.id} onClick={()=>openEdit(tx,tx.type)} style={{display:"flex",alignItems:"center",gap:10,padding:"11px 12px",borderRadius:11,background:"rgba(255,255,255,.04)",border:"1px solid rgba(255,255,255,.06)",marginBottom:6,cursor:"pointer"}}>
      <div style={{width:36,height:36,borderRadius:9,background:tx.type==="income"?"rgba(52,211,153,.15)":"rgba(251,113,133,.1)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0}}>{tx.type==="income"?"💵":(ECATS[tx.cat]||"📦").split(" ")[0]}</div>
      <div style={{flex:1,minWidth:0}}><div style={{fontSize:13,fontWeight:700,overflow:"hidden",whiteSpace:"nowrap",textOverflow:"ellipsis"}}>{tx.desc}</div><div style={{fontSize:10,opacity:.4}}>{tx.type==="expense"?(ECATS[tx.cat]||"Other").replace(/^.+\s/,""):"Income"} · {relDay(tx.date)}</div></div>
      <div style={{fontSize:14,fontWeight:800,color:tx.type==="income"?"#34D399":"#FB7185",whiteSpace:"nowrap"}}>{tx.type==="income"?"+":"-"}{fmtM(tx.amount)}</div>
    </div>))}
    {modal&&<Modal onClose={()=>setModal(false)} title={editId?"✏️ Edit":"+"+" "+(type==="income"?"Income":"Expense")} actions={<>
      <button onClick={()=>setModal(false)} style={{flex:1,padding:12,borderRadius:12,background:"rgba(255,255,255,.07)",color:"rgba(240,238,248,.6)",fontWeight:700,fontSize:14}}>Cancel</button>
      {editId&&<button onClick={del} style={{padding:"12px 14px",borderRadius:12,background:"rgba(251,113,133,.12)",color:"#FB7185",fontWeight:700,fontSize:14}}>Delete</button>}
      <GBtn style={{flex:1}} onClick={save}>Save</GBtn>
    </>}>
      <FIn placeholder="Description" value={form.desc} onChange={e=>setForm(f=>({...f,desc:e.target.value}))} autoFocus/>
      <FIn type="number" placeholder="Amount (₦)" value={form.amount} onChange={e=>setForm(f=>({...f,amount:e.target.value}))}/>
      {type==="expense"&&<FSel value={form.cat} onChange={e=>setForm(f=>({...f,cat:e.target.value}))}>
        {Object.entries(ECATS).map(([k,v])=><option key={k} value={k}>{v}</option>)}
      </FSel>}
      <FIn type="date" value={form.date} onChange={e=>setForm(f=>({...f,date:e.target.value}))}/>
    </Modal>}
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
